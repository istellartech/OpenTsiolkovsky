[package]
name = "openTsiolkovsky"
version = "1.0.0"
edition = "2024"
description = "OpenTsiolkovsky rocket flight simulator with CLI and WASM support"
license = "MIT"
repository = "https://github.com/istellartech/OpenTsiolkovsky"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "openTsiolkovsky-cli"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "openTsiolkovsky-optimize"
path = "src/optimization_cli.rs"
required-features = ["cli", "optimization"]

[dependencies]
# Core dependencies
nalgebra = { version = "0.32", features = ["serde-serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
csv = "1.3"
thiserror = "1.0"

# Upgrade only after native/WASI numerical regression tests.
pounce-nlp = { version = "=0.12.0", optional = true }
pounce-algorithm = { version = "=0.12.0", optional = true }
pounce-restoration = { version = "=0.12.0", optional = true }

# CLI dependencies
clap = { version = "4.4", features = ["derive"], optional = true }
# JSON Schema of the configuration files (`schema` subcommand, MCP server)
schemars = { version = "1.2", optional = true }
# Raw DEFLATE for web app share links
miniz_oxide = { version = "0.9", optional = true }

# WASM dependencies
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["cli"]
cli = ["clap", "schema", "miniz_oxide"]
schema = ["schemars"]
wasm = ["wasm-bindgen", "console_error_panic_hook"]
optimization = ["dep:pounce-nlp", "dep:pounce-algorithm", "dep:pounce-restoration"]

[dev-dependencies]
approx = "0.5"
tempfile = "3.8"
